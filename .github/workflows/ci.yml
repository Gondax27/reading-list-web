name: CI & Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  biome:
    name: Biome (Format, Lint & Imports)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: "2.5.11"

      - name: Run Biome CI
        run: biome ci .

  typecheck-and-build:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build & Typecheck (Vite + TypeScript)
        run: npm run build
